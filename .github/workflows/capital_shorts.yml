name: Bot YouTube - Shorts Capital Digital (2 al día)

on:
  schedule:
    - cron: '0 14 * * *'   # 9:00 AM CDMX (14:00 UTC)
    - cron: '0 21 * * *'   # 4:00 PM CDMX (21:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install "Pillow<10.0.0"
          pip install moviepy==1.0.3
          pip install requests google-auth google-api-python-client google-auth-oauthlib
          pip install edge-tts
          pip install json5
          pip install pytz
          sudo apt-get update --fix-missing
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Ejecutar bot de Shorts
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_USER_TOKEN_CAPITAL: ${{ secrets.YOUTUBE_USER_TOKEN_CAPITAL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python bot_capital_shorts.py

      - name: Limpiar archivos temporales
        run: |
          rm -f *.mp3 *.mp4 *.jpg temp_* placeholder_* short_capital_es.mp4 miniatura_short_es.jpg temp_cf_*.jpg 2>/dev/null || true
          echo "🧹 Archivos temporales eliminados"

      - name: Commit y push del estado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar estado Capital Digital shorts [skip ci]"
          file_pattern: "estado_capital_shorts_es.json titulos_capital_shorts_es_publicados.json temas_shorts_es_publicados.json trends_semanal_es.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
