name: Bot YouTube - Shorts Capital Digital (3 al día)

on:
  schedule:
    - cron: '12 13 * * *'   # 8:12 AM CDMX (13:12 UTC)
    - cron: '28 17 * * *'   # 12:28 PM CDMX (17:28 UTC)
    - cron: '41 21 * * *'   # 4:41 PM CDMX (21:41 UTC)
    - cron: '53 23 * * *'   # 6:53 PM CDMX (23:53 UTC) - RESPALDO
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install "Pillow<10.0.0"
          pip install moviepy==1.0.3
          pip install requests google-auth google-api-python-client google-auth-oauthlib
          pip install edge-tts
          pip install json5
          pip install pytz
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Ejecutar bot de Shorts (Capital Digital)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_USER_TOKEN_CAPITAL: ${{ secrets.YOUTUBE_USER_TOKEN_CAPITAL }}
        run: python bot_capital_shorts.py

      - name: 🔥 Limpiar archivos temporales antes del commit
        run: |
          rm -f *.mp3 *.mp4 *.jpg temp_* placeholder_* short_capital_en.mp4 miniatura_short_en.jpg 2>/dev/null || true
          echo "🧹 Archivos temporales eliminados"

      - name: 📦 Commit y push automático de los estados
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar estado Capital Digital shorts [skip ci]"
          file_pattern: "estado_capital_shorts.json titulos_capital_shorts_publicados.json temas_shorts_publicados.json estado_capital_shorts_en.json titulos_capital_shorts_en_publicados.json temas_shorts_en_publicados.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          push_options: "--force"
