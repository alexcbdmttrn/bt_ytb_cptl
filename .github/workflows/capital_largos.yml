name: Bot YouTube - Video Largo Capital Digital (1 cada 2 días)

on:
  schedule:
    - cron: '23 21 */2 * *'   # Cada 2 días a las 3:23 PM CDMX (21:23 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install "Pillow<10.0.0"
          pip install moviepy==1.0.3
          pip install requests google-auth google-api-python-client google-auth-oauthlib
          pip install edge-tts
          pip install json5
          pip install pytz
          pip install numpy
          sudo apt-get update --fix-missing
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Ejecutar bot de Largos
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_USER_TOKEN_CAPITAL: ${{ secrets.YOUTUBE_USER_TOKEN_CAPITAL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python bot_capital_largos.py

      - name: Forzar guardado de estado (Safety Check)
        run: |
          # Verificamos que el archivo exista y tenga contenido
          if [ -f "estado_capital_largos_es.json" ]; then
            echo "✅ El archivo de estado existe y se actualizará."
            cat estado_capital_largos_es.json
          else
            echo "❌ ERROR: El archivo de estado no existe."
            exit 1
          fi

      - name: Limpiar archivos temporales
        run: |
          rm -f *.mp3 *.mp4 *.jpg temp_* placeholder_* largo_capital_es.mp4 miniatura_largo_es.jpg temp_cf_*.jpg 2>/dev/null || true
          echo "🧹 Archivos temporales eliminados"

      - name: Commit y push del estado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar estado Capital Digital largos [skip ci]"
          file_pattern: "estado_capital_largos_es.json titulos_capital_largos_es_publicados.json temas_largos_es_publicados.json trends_semanal_largos_es.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          skip_checkout: false
